name: Unit test processor

on:
  push:
    branches: ["feature_561827"]
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
    
      - name: Setup python
        uses: actions/setup-python@v3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
    
      - name: Testing modules
        run: |
          ./run_tests.sh

  unit-tests-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
    
      - name: Setup python
        uses: actions/setup-python@v3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
    
      - name: Testing modules
        run: |
          run_tests.bat
