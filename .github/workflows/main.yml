name: Unit test processor

on:
  push:
    branches: ["feature_561827"]
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Setup python
        uses: actions/setup-python@v3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
    
      - name: Testing rectangle.py
        run: python -m unittest rectangle.py

      - name: Testing square.py
        run: python -m unittest square.py

      
      - name: Testing circle.py
        run: python -m unittest circle.py

      
      - name: Testing triangle.py
        run: python -m unittest triangle.py
